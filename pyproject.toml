[project]
name = "trispoke-outbound"
version = "0.1.0"
description = "AI-powered cold email system"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy>=2.0",
    "alembic",
    "openpyxl",
    "pandas",
    "jinja2",
    "loguru",
    "imap-tools",
    "streamlit",
    "streamlit-quill",
    "anthropic",
    "openai",
    "cryptography>=48.0.0",
    "psycopg[binary]>=3.3.4",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trispoke"]

[tool.pytest.ini_options]
pythonpath = ["src"]
